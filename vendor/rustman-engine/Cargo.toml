[package]
edition = "2024"
name = "rustman-engine"
version = "0.1.0"
description = "A tiny, deliberately simple scripting language for API pre-request/test scripts — designed to be generated by AI and interpreted in pure Rust (no JS/QuickJS/V8 dependency)."
license = "MIT"
resolver = "2"

[lib]
name = "rustman_engine"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
sha2 = "0.10"

[dependencies.serde_json]
version = "1"

[dependencies.base64]
version = "0.23"

[lints.rust]
unsafe_code = "forbid"
