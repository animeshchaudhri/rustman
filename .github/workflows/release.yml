name: Release

on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tag
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            VERSION="${BASE}-dev.${{ github.run_number }}"
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Rustman ${{ steps.ver.outputs.tag }}"
          body: |
            **Rustman ${{ steps.ver.outputs.tag }}**

            Built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            Download the installer for your platform below. The app will also auto-update if you already have it installed.
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Rustman iced · Linux binary ───────────────────────────────────────────────
  build-linux-iced:
    name: Build · Rustman iced · Linux x86_64
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        run: tar czf rustman-linux-x86_64.tar.gz -C target/release rustman

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: rustman-linux-x86_64.tar.gz

  # ── Rustman iced · macOS universal binary ────────────────────────────────────
  build-macos-iced:
    name: Build · Rustman iced · macOS universal
    needs: prepare
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/rustman \
            target/x86_64-apple-darwin/release/rustman \
            -output rustman
          tar czf rustman-macos-universal.tar.gz rustman

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: rustman-macos-universal.tar.gz

  # ── Rustman iced · Windows x86_64 ────────────────────────────────────────────
  build-windows-iced:
    name: Build · Rustman iced · Windows x86_64
    needs: prepare
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$env:VERSION`"" | Set-Content Cargo.toml
          Write-Host "Patched Cargo.toml to $env:VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path target\release\rustman.exe -DestinationPath rustman-windows-x86_64.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: rustman-windows-x86_64.zip
