[package]
name = "rustman"
version = "0.3.2"
edition = "2021"
description = "Rustman — pure-Rust native API testing tool built with iced"
authors = ["animeshchaudhri"]

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
# GUI
iced = { version = "0.13", features = ["tokio", "advanced", "image", "svg"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "multipart",
    "stream",
    "rustls-tls",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Git VCS for collections
git2 = "0.19"

# Syntax highlighting
tree-sitter = "0.23"
tree-sitter-json = "0.23"
tree-sitter-javascript = "0.23"

# Script runner (pre-request / test scripts)
rquickjs = { version = "0.11", features = ["futures"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Crypto (for JWT auth helper)
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
rfd = "0.14"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
