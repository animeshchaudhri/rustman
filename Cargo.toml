[package]
name = "rustman"
version = "0.3.7"
edition = "2024"
description = "Rustman — pure-Rust native API testing tool built with iced"
authors = ["animeshchaudhri"]

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "svg"] }
# Full-featured code editor widget (line numbers, syntect highlight, selection, undo)
iced-code-editor = "0.3.9"
image = { version = "0.25", default-features = false, features = ["png"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "cookies",
    "multipart",
    "stream",
    "rustls",
    "rustls-native-certs",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
# Cooperative cancellation for background jobs (CancellationToken)
tokio-util = "0.7"

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
 
# Storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Git VCS for collections
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }

# Crypto (for JWT auth helper)
base64 = "0.22"
sha2 = "0.11"
hmac = "0.13"

# LRU cache for parsed response bodies
lru = "0.18"

# In-app self-update: reuses the existing (ring-based) reqwest to fetch a release
# asset, then extracts + atomically swaps the binary. All pure-Rust, no C toolchain.
self-replace = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
rfd = "0.17"

[patch.crates-io]
iced-code-editor = { path = "vendor/iced-code-editor" }

[profile.release]
opt-level = 'z'  
strip = true
lto = true
codegen-units = 1
panic = "abort"
