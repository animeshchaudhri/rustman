[package]
name = "rustman"
version = "0.3.4"
edition = "2021"
description = "Rustman — pure-Rust native API testing tool built with iced"
authors = ["animeshchaudhri"]

[[bin]]
name = "rustman"
path = "src/main.rs"

[dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "svg"] }
# Full-featured code editor widget (line numbers, syntect highlight, selection, undo)
iced-code-editor = "0.3.9"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "multipart",
    "stream",
    "rustls-tls",
    "rustls-tls-native-roots",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }
# Cooperative cancellation for background jobs (CancellationToken)
tokio-util = "0.7"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
 
# Embedded JavaScript engine for pre-request / test scripts (pure Rust, no C toolchain)
boa_engine = "0.20"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Git VCS for collections
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }

# Crypto (for JWT auth helper)
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# LRU cache for parsed response bodies
lru = "0.12"

# In-app self-update: reuses the existing (ring-based) reqwest to fetch a release
# asset, then extracts + atomically swaps the binary. All pure-Rust, no C toolchain.
self-replace = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
rfd = "0.14"

[patch.crates-io]
iced-code-editor = { path = "vendor/iced-code-editor" }

[profile.release]
opt-level = 'z'  
strip = true
lto = true
codegen-units = 1
panic = "abort"
